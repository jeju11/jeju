<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="제주시와 서귀포시 구도심의 과거 주말 카드 이용을 비교합니다.">
    <meta name="theme-color" content="#ffffff">
    <title>제주 상권 비교</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <script src="/assets/results.js" defer></script>
    <script src="/assets/app.js" defer></script>
  </head>
  <body id="top">
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="제주 상권 비교 홈">제주 상권 비교</a>
      <a class="how-link" href="#how">이용 방법 <span aria-hidden="true">→</span></a>
    </header>

    <main class="page-shell" id="main" tabindex="-1">
      <section class="hero-section" id="search-view" aria-labelledby="page-title">
        <div class="eyebrow" aria-hidden="true">JEJU COMMERCIAL AREA DATA</div>
        <h1 id="page-title">어느 동네에<br class="desktop-break"> 가게를 열까요?</h1>
        <p class="intro">제주 구도심의 과거 주말 카드 이용을 비교해 보세요.</p>

        <form class="search-form" id="agent-form" aria-busy="false">
          <label class="query-label" for="question">비교하고 싶은 내용을 적어 주세요</label>
          <div class="input-row">
            <textarea class="question-input" id="question" name="question" rows="1" maxlength="300"
              aria-describedby="availability-note data-scope" placeholder="지역과 기간을 넣어 질문해 보세요."></textarea>
            <button class="primary-button" id="agent-submit" type="submit" disabled>
              <span id="submit-label">비교하기</span><span class="button-arrow" aria-hidden="true">→</span>
            </button>
          </div>
        </form>
        <div class="quick-actions">
          <button class="example-button" id="example-trigger" type="button" disabled><span class="action-dot" aria-hidden="true"></span>예시로 비교하기</button>
          <button class="secondary-button" id="settings-button" type="button" aria-controls="manual-panel" aria-expanded="false" disabled>
            <span class="action-dot hollow" aria-hidden="true"></span>조건 직접 선택<span class="quick-chevron" aria-hidden="true">⌄</span>
          </button>
        </div>
        <p class="availability-note" id="availability-note" hidden></p>

        <details class="manual-panel" id="manual-panel">
          <summary class="sr-only" tabindex="-1">조건 직접 선택</summary>
          <div class="manual-content">
            <form id="manual-form" aria-busy="false">
              <fieldset class="manual-fields direct-picker" id="manual-fields" disabled>
                <legend class="sr-only">비교 조건</legend>
                <div class="field"><label for="manual-district">비교 지역</label><select id="manual-district" name="district"></select></div>
                <div class="field"><label for="manual-visitor">관광객 유형</label><select id="manual-visitor" name="visitor_type"></select></div>
                <div class="field"><label for="manual-start">시작 월</label><select id="manual-start" name="start_month" required></select></div>
                <div class="field"><label for="manual-end">종료 월</label><select id="manual-end" name="end_month" required></select></div>
                <div class="field"><label for="manual-metric">비교 지표</label><select id="manual-metric" name="metric"></select></div>
              </fieldset>
              <div class="manual-actions">
                <p class="manual-hint" id="manual-hint"></p>
                <button class="primary-button" id="manual-submit" type="submit" disabled>선택한 조건으로 비교</button>
              </div>
            </form>
          </div>
        </details>

        <div class="hero-rule"></div>
        <div class="place-note">
          <div class="stone-mark" aria-hidden="true"></div>
          <div>
            <strong>제주의 다음 장면을 숫자로 살펴보세요</strong>
            <p class="data-scope" id="data-scope" hidden></p>
          </div>
        </div>
      </section>

      <div class="request-state" id="request-state" hidden>
        <div class="request-copy" role="status" aria-live="polite">
          <p id="request-title"></p>
          <p id="activity-status"></p>
        </div>
        <button class="secondary-button" id="retry-button" type="button" hidden>다시 시도</button>
      </div>

      <section class="conversation" id="conversation" aria-label="분석 결과" hidden>
        <div id="conversation-history"></div>
      </section>
    </main>

    <footer class="page-footer" id="how" tabindex="-1">
      <span>제주 상권 비교</span>
      <span>질문을 입력하거나 비교 조건을 직접 선택해 주세요.</span>
      <a id="header-source-link" href="https://jejudatahub.net/data/view/data/608" target="_blank" rel="noopener noreferrer">제주데이터허브 608번 <span aria-hidden="true">↗</span></a>
    </footer>
    <noscript><p class="availability-note">이 화면을 이용하려면 자바스크립트를 켜 주세요.</p></noscript>
  </body>
</html>
